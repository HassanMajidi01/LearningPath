  <script>
    const menuToggleBtn = document.getElementById('menu-toggle-btn');
    const sidebar = document.getElementById('sidebar-nav');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    
    function toggleSidebar() {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('visible');
    }

    menuToggleBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', toggleSidebar);

    // ✨ کد جدید برای کنترل نمایش سکشن‌ها ✨
    const sidebarLinks = document.querySelectorAll('.sidebar-link');
    const contentSections = document.querySelectorAll('.content-section');

    sidebarLinks.forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault(); // جلوگیری از پرش صفحه
        
        const targetId = this.dataset.target;

        // 1. فعال کردن لینک کلیک شده در سایدبار
        sidebarLinks.forEach(s_link => s_link.classList.remove('active'));
        this.classList.add('active');

        // 2. نمایش دادن سکشن مربوطه
        contentSections.forEach(section => {
          if (section.id === targetId) {
            section.classList.add('active');
          } else {
            section.classList.remove('active');
          }
        });
        
        // 3. بستن سایدبار در حالت موبایل بعد از انتخاب
        if (sidebar.classList.contains('open')) {
          toggleSidebar();
        }
      });
    });
  </script>
