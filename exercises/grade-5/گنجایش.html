<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل واحد برای دختران زرنگ</title>
    <style>
        /* @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Vazirmatn:wght@400;700&display=swap'); */

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #ffebee; /* تم صورتی روشن */
            color: #880e4f; /* رنگ متن تیره تر برای کنتراست */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-family: 'Amatic SC', cursive;
            color: #e91e63; /* صورتی پررنگ */
            font-size: 2.8em;
            margin-bottom: 25px;
        }

        .designer-info {
            font-size: 0.9em;
            color: #c2185b; /* صورتی تیره تر */
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.7em;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-button {
            background-color: #f48fb1; /* صورتی میانه */
            color: white;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.5em;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Amatic SC', cursive;
        }

        .option-button:hover {
            background-color: #d81b60; /* صورتی تیره تر */
            transform: scale(1.03);
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            height: 40px;
        }

        .score-section {
            margin-top: 15px;
            font-size: 1.4em;
            color: #e91e63;
            font-family: 'Amatic SC', cursive;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مسابقه تبدیل واحد</h1>
        <div id="designer-info" class="designer-info">طراح: کبری قربانی دبستان دخترانه سما، بندرانزلی</div>
        <div id="question-text" class="question-text"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback"></div>
        <div id="score-section" class="score-section">امتیاز: 0</div>
    </div>

    <script>
        const questions = [
            { question: '2 لیتر چند سی سی است؟', answer: 2000, options: [1000, 2000, 20, 2] },
            { question: '500 سی سی چند لیتر است؟', answer: 0.5, options: [5, 50, 0.5, 0.05] },
            { question: '1.5 لیتر چند سی سی است؟', answer: 1500, options: [150, 1500, 15, 1.5] },
            { question: '3000 سی سی چند لیتر است؟', answer: 3, options: [30, 0.3, 3, 300] },
            { question: '0.75 لیتر چند سی سی است؟', answer: 750, options: [75, 7.5, 750, 0.075] },
            { question: '1000 سی سی چند لیتر است؟', answer: 1, options: [10, 0.1, 100, 1] }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        const designerInfo = "طراح: کبری قربانی دبستان دخترانه سما، بندرانزلی";

        function loadQuestion() {
            if (currentQuestionIndex < questions.length) {
                const q = questions[currentQuestionIndex];
                document.getElementById('question-text').textContent = q.question;
                document.getElementById('designer-info').textContent = designerInfo; // Set designer info for each question
                
                const optionsDiv = document.getElementById('options');
                optionsDiv.innerHTML = '';
                
                q.options.sort(() => Math.random() - 0.5);
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.textContent = opt;
                    btn.className = 'option-button';
                    btn.onclick = () => checkAnswer(opt, q.answer);
                    optionsDiv.appendChild(btn);
                });
            } else {
                document.querySelector('.container').innerHTML = `<h1>پایان بازی!</h1><p style="font-size:2em; color: #880e4f;">امتیاز نهایی تو: ${score}</p>`;
            }
        }

        function checkAnswer(selected, correct) {
            const feedback = document.getElementById('feedback');
            if (selected === correct) {
                score++;
                feedback.textContent = 'آفرین! درسته! ✨';
                feedback.style.color = '#388e3c'; // سبز تیره برای بازخورد مثبت
                document.getElementById('score-section').textContent = `امتیاز: ${score}`;
                setTimeout(() => { currentQuestionIndex++; loadQuestion(); feedback.textContent = ''; }, 1000);
            } else {
                feedback.textContent = 'اوه! اشتباه بود، دوباره تلاش کن.';
                feedback.style.color = '#d32f2f'; // قرمز تیره برای بازخورد منفی
            }
        }

        loadQuestion();
    </script>

    <script src="../../shared-layout.js"></script>
</body>
</html>
