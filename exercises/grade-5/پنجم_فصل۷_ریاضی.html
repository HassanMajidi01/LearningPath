<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>آزمونک ریاضی پنجم - میانگین</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #ffe8b6; /* نارنجی پررنگ */
            color: #333; /* نوشته‌های مشکی */
            margin: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #a5d6a7;
            color: #000;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1em;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px dashed #ccc;
            border-radius: 6px;
            background-color: #fdfcfb;
        }
        .question-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .input-field, .multi-input-field {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            width: calc(33% - 12px); /* برای multi-input */
            display: inline-block; /* برای کنار هم قرار گرفتن */
        }
        .check-button {
            background-color: #ffb74d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        .check-button:hover {
            background-color: #f4511e;
        }
        .feedback {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 30px;
        }
        .correct {
            color: #4caf50;
        }
        .incorrect {
            color: #f44336;
        }
        .score-display {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #2196f3;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 1.1em;
            color: #777;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .footer span {
            font-size: 1.3em;
            margin: 0 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        طراح سوال: کبری قربانی، دبستان دخترانه ی سما، واحد بندر انزلی
    </div>

    <div id="quiz-container"></div>

    <div class="score-display">
        امتیاز شما: <span id="score">0</span> / 5
    </div>

    <div class="footer">
        دخترای سخت کوش پنجم دریا خانم قربانی بهتون افتخار میکنه <span>❤️</span><span>❤️</span>
    </div>
</div>

<script>
const questions = [
    {
        type: "multi-number",
        question: "سه عدد متوالی (پشت سر هم) بنویس که میانگین آنها ۲۱ باشد",
        placeholders: ["عدد اول", "عدد دوم", "عدد سوم"],
        answer: [20, 21, 22],
        answer_check: function(userAnswers, correctAnswer) {
            if (userAnswers.length !== 3) return false;
            const sortedUserAnswers = userAnswers.map(Number).sort((a, b) => a - b);
            const sortedCorrectAnswers = correctAnswer.map(Number).sort((a, b) => a - b);
            return JSON.stringify(sortedUserAnswers) === JSON.stringify(sortedCorrectAnswers);
        }
    },
    {
        type: "single-number",
        question: "میانگین اعداد ۹،۴،۵ را بدست آور",
        answer: 6, // اصلاح شده به ۶
        answer_check: function(userAnswer, correctAnswer) {
            return Number(userAnswer) === correctAnswer;
        }
    },
    {
        type: "number",
        question: "مجموع تعدادی داده ۳۰۰ شده است؛ اگر میانگین این داده‌ها ۳۰ باشد تعداد داده‌ها چند تا است؟",
        answer: 10,
        answer_check: function(userAnswer, correctAnswer) {
            return Number(userAnswer) === correctAnswer;
        }
    },
    {
        type: "multi-number",
        question: "دو عدد مثال بزن که میانگین آنها ۱۰ باشد",
        placeholders: ["عدد اول", "عدد دوم"],
        answer: [10, 10], // یا موارد دیگر
        answer_check: function(userAnswers, correctAnswer) {
            if (userAnswers.length !== 2) return false;
            const sum = userAnswers.reduce((s, n) => s + Number(n), 0);
            return sum / 2 === 10;
        }
    },
    {
        type: "number",
        question: "زهرا، تبسم، یاسمین، سوگل، ثمین، نرگس، مهرنوش و آرنیکا در هفته‌ی گذشته هر کدام به ترتیب ۷، ۷، ۸، ۹، ۱۰، ۵، ۴،۶ ساعت مطالعه کردند. آنها به طور میانگین چند ساعت مطالعه کردند؟",
        answer: 7,
        answer_check: function(userAnswer, correctAnswer) {
            return Math.abs(Number(userAnswer) - correctAnswer) < 0.01;
        }
    }
];

let currentQuestionIndex = 0;
let score = 0;
const quizContainer = document.getElementById('quiz-container');
const scoreDisplay = document.getElementById('score');

function renderQuestion() {
    if (currentQuestionIndex >= questions.length) {
        quizContainer.innerHTML = '<p class="question-text">آزمون به پایان رسید! ممنون از شرکت شما.</p>';
        return;
    }

    const q = questions[currentQuestionIndex];
    let questionHTML = `<div class="question-block" id="question-${currentQuestionIndex}">`;
    questionHTML += `<p class="question-text">${currentQuestionIndex + 1}. ${q.question}</p>`;

    if (q.type === "multi-number") {
        q.placeholders.forEach((placeholder, index) => {
            questionHTML += `<input type="number" class="multi-input-field" placeholder="${placeholder}" id="input-${index}" ${q.disabled ? 'disabled' : ''}>`;
        });
    } else {
        questionHTML += `<input type="number" class="input-field" id="input-0" ${q.disabled ? 'disabled' : ''}>`;
    }
    questionHTML += `<div class="feedback" id="feedback-${currentQuestionIndex}"></div>`;
    questionHTML += `<button class="check-button" onclick="checkAnswer(${currentQuestionIndex})">بررسی پاسخ</button>`;
    questionHTML += `</div>`;
    quizContainer.innerHTML = questionHTML;
}

function checkAnswer(index) {
    const q = questions[index];
    let userAnswers = [];
    let feedbackElement = document.getElementById(`feedback-${index}`);
    let allInputsDisabled = true; // فرض می کنیم همه غیرفعال هستند

    if (q.type === "multi-number") {
        const inputs = document.querySelectorAll(`#question-${index} .multi-input-field`);
        inputs.forEach((input, i) => {
            userAnswers.push(input.value);
            if (input.value === "") allInputsDisabled = false; // اگر ورودی خالی بود، غیرفعال نیست
        });
    } else {
        userAnswers = document.getElementById(`input-0`).value;
        if (userAnswers === "") allInputsDisabled = false;
    }

    if (allInputsDisabled) {
        const isCorrect = q.answer_check(userAnswers, q.answer);
        if (isCorrect) {
            feedbackElement.textContent = "پاسخ صحیح است! آفرین!";
            feedbackElement.className = "feedback correct";
            score++;
            scoreDisplay.textContent = score;
            // غیرفعال کردن ورودی‌ها و دکمه پس از بررسی صحیح
            const inputs = document.querySelectorAll(`#question-${index} input`);
            inputs.forEach(input => input.disabled = true);
            const button = document.querySelector(`#question-${index} .check-button`);
            button.disabled = true;
            q.disabled = true; // علامت گذاری سوال به عنوان غیرفعال

            // رفتن به سوال بعد بعد از یک تاخیر کوتاه
            setTimeout(() => {
                currentQuestionIndex++;
                renderQuestion();
            }, 1500);
        } else {
            feedbackElement.textContent = "پاسخ اشتباه است. دوباره تلاش کن.";
            feedbackElement.className = "feedback incorrect";
            // ورودی‌ها و دکمه را غیرفعال نکنید تا کاربر بتواند دوباره تلاش کند.
        }
    } else {
        feedbackElement.textContent = "لطفاً همه قسمت‌ها را پر کنید.";
        feedbackElement.className = "feedback incorrect";
    }
}

// شروع آزمون
renderQuestion();
</script>
</body>
</html>
