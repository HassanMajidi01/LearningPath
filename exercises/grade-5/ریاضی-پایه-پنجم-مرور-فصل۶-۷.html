<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>بازی ریاضی شاد</title>
  <style>
    :root{
      --pink:#ff5fb7;
      --purple:#8e44ad;
      --card: rgba(255,255,255,0.92);
      --text:#333;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      font-family: Tahoma, sans-serif;
      overflow-x:hidden;
      background: linear-gradient(
        135deg,
        #ff9a9e 0%,
        #fad0c4 15%,
        #fbc2eb 30%,
        #a6c1ee 45%,
        #c2ffd8 60%,
        #fddb92 75%,
        #cfd9df 100%
      );
      background-size: 400% 400%;
      animation: rainbowBG 18s ease infinite;
      display:flex;
      justify-content:center;
      padding:20px;
    }

    @keyframes rainbowBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container{
      width:100%;
      max-width:700px;
      position:relative;
      background: var(--card);
      border-radius:30px;
      padding:25px 18px 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      overflow:hidden;
      border: 4px solid rgba(255,255,255,0.7);
    }

    .header{
      text-align:center;
      font-weight:bold;
      color:#6a1b9a;
      font-size:18px;
      margin-bottom:10px;
      line-height:1.8;
    }

    .title{
      text-align:center;
      font-size:24px;
      font-weight:bold;
      color:#d81b60;
      margin-bottom:12px;
    }

    .q-count{
      text-align:center;
      font-size:18px;
      color:#444;
      font-weight:bold;
      margin-bottom:12px;
      background:#fff6fb;
      border:2px dashed #ff7ad9;
      border-radius:14px;
      padding:8px 12px;
    }

    .q-text{
      font-size:21px;
      line-height:2;
      color:var(--text);
      text-align:center;
      margin: 10px 0 18px;
      min-height:80px;
      padding:0 8px;
    }

    .input-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    input[type="number"], input[type="text"]{
      width:90%;
      max-width:420px;
      padding:14px 12px;
      font-size:18px;
      border-radius:14px;
      border:2px solid #ddd;
      outline:none;
      text-align:center;
      background:white;
    }

    .btn{
      border:none;
      background: linear-gradient(135deg, #ff6fb5, #ff3d7f);
      color:white;
      font-size:18px;
      padding:12px 26px;
      border-radius:16px;
      cursor:pointer;
      box-shadow: 0 6px 15px rgba(255, 61, 127, 0.35);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover{
      transform: scale(1.03);
    }

    .option-btn{
      width:90%;
      max-width:420px;
      padding:13px 14px;
      font-size:17px;
      border-radius:14px;
      border:2px solid #ff7ad9;
      background:white;
      cursor:pointer;
      text-align:center;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.07);
    }

    .option-btn:hover{
      background:#fff0f8;
      transform: translateY(-1px);
    }

    .feedback{
      text-align:center;
      margin-top:12px;
      font-size:20px;
      font-weight:bold;
      min-height:34px;
    }

    .score-box{
      text-align:center;
      margin-top:14px;
      font-size:18px;
      color:#444;
      font-weight:bold;
    }

    .final{
      text-align:center;
      font-size:22px;
      line-height:2;
      color:#6a1b9a;
      padding:20px 10px;
    }

    .cross{
      position:fixed;
      top:-120px;
      left:50%;
      transform:translateX(-50%);
      font-size:110px;
      color:red;
      text-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index:9999;
      pointer-events:none;
      opacity:0;
    }

    .cross.show{
      animation: dropCross 1s ease forwards;
    }

    @keyframes dropCross{
      0%   { top:-120px; opacity:0; }
      20%  { opacity:1; }
      70%  { top:90px; opacity:1; }
      100% { top:60px; opacity:0; }
    }

    .flower{
      position:fixed;
      top:-30px;
      font-size:28px;
      pointer-events:none;
      z-index:9998;
      animation: fallFlower 2.8s linear forwards;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
    }

    @keyframes fallFlower{
      0%   { transform: translateY(0) rotate(0deg); opacity:1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
    }

    .small-note{
      font-size:14px;
      color:#666;
      text-align:center;
      margin-top:8px;
    }

    @media (max-width: 480px){
      .q-text{ font-size:18px; }
      .title{ font-size:21px; }
      .container{ padding:20px 12px 26px; }
      .option-btn{ font-size:16px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">طراح: کبری قربانی — دبستان دخترانه سما واحد بندر انزلی</div>
  <div class="title">بازی ریاضی شاد</div>

  <div class="q-count" id="qCount"></div>
  <div id="qText" class="q-text"></div>

  <div id="inputArea" class="input-area"></div>

  <div id="feedback" class="feedback"></div>
  <div class="score-box">امتیاز: <span id="score">0</span> / 20</div>
  <div class="small-note">هر پاسخ درست ۱ امتیاز دارد.</div>
</div>

<div id="cross" class="cross">❌</div>

<script>
  const questions = [
    { q: 'محیط دایره‌ای به شعاع ۷ سانتی‌متر چند است؟ (عدد پی = ۳)', a: 42, type: 'number' },
    { q: 'مساحت لوزی با قطر بزرگ ۱۰ و قطر کوچک ۸ چند است؟', a: 40, type: 'number' },
    { q: 'مساحت ذوزنقه با قاعده ۱۲ و ۸ و ارتفاع ۳ چند است؟', a: 30, type: 'number' },
    { q: 'اگر مساحت لوزی ۲۱ و یک قطر ۷ باشد، قطر دیگر چند است؟', a: 6, type: 'number' },
    { q: 'حجم یک مکعب با ضلع ۴ چند است؟', a: 64, type: 'number' },
    { q: 'میانگین اعداد ۱۰ و ۲۰ چند است؟', a: 15, type: 'number' },
    { q: '۳ لیتر چند سی‌سی است؟', a: 3000, type: 'number' },
    { q: '۴۰۰۰ سی‌سی چند لیتر است؟', a: 4, type: 'number' },
    { q: 'محیط دایره‌ای به قطر ۱۰ چند است؟ (عدد پی = ۳)', a: 30, type: 'number' },
    { q: 'مساحت ذوزنقه با قاعده ۷ و ۳ و ارتفاع ۴ چند است؟', a: 20, type: 'number' },
    { q: 'حجم مکعب مستطیلی با ابعاد ۱۱، ۸ و ۹ چند است؟', a: 792, type: 'number' },
    { q: '۰/۲۵ لیتر چند سی‌سی است؟', a: 250, type: 'number' },
    {
      q: 'احتمال اینکه فردا شنبه باشد، اگر امروز پنج‌شنبه است، کدام است؟',
      type: 'select',
      options: ['صفر (غیرممکن)', 'یک (حتمی)'],
      a: 'صفر (غیرممکن)'
    },
    {
      q: 'اگر شرایط برد و باخت برابر باشد، بازی چگونه است؟',
      type: 'select',
      options: ['عادلانه', 'غیرعادلانه'],
      a: 'عادلانه'
    },
    {
      q: 'میانگین نمرات ۱۸.۵، ۱۷، ۲۰، ۲۰، ۱۹.۵ کدام است؟',
      type: 'select',
      options: ['۱۹', '۱۸'],
      a: '۱۹'
    },
    {
      q: 'در چرخنده‌ای با ۳ رنگ زرد و ۱ رنگ صورتی، احتمال ایستادن روی زرد نسبت به صورتی چگونه است؟',
      type: 'select',
      options: ['بیشتر است', 'کمتر است'],
      a: 'بیشتر است'
    },
    {
      q: 'اگر قطر یک دایره ۳ برابر شود، محیط آن چند برابر می‌شود؟',
      type: 'select',
      options: ['۳ برابر', '۹ برابر'],
      a: '۳ برابر'
    },
    {
      q: 'شعاع یک نیم‌دایره ۲ سانتی‌متر است. محیط آن چند است؟ (عدد پی = ۳)',
      type: 'select',
      options: ['۱۰ سانتی‌متر', '۱۲ سانتی‌متر'],
      a: '۱۰ سانتی‌متر'
    },
    {
      q: 'اگر از بین ۵ مهره زرد و ۵ مهره آبی، ۶ مهره را درون کیسه‌ای بیندازیم و بدون نگاه کردن یک مهره خارج کنیم، برای اینکه احتمال آمدن مهره زرد بیشتر از آبی باشد، چه تعداد مهره زرد و آبی باید در کیسه باشد؟',
      type: 'select',
      options: ['۴ زرد و ۲ آبی', '۳ زرد و ۳ آبی', '۵ زرد و ۱ آبی'],
      a: '۴ زرد و ۲ آبی'
    },
    {
      q: 'اگر حجم مکعب مستطیلی ۷۰ سانتی‌متر مکعب باشد و طول و عرض آن ۷ و ۵ سانتی‌متر باشند، ارتفاع آن چقدر است؟',
      type: 'number',
      a: 2
    }
  ];

  let current = 0;
  let score = 0;
  const totalQuestions = questions.length;
  const maxScore = totalQuestions; // هر سوال ۱ امتیاز

  const qCountEl = document.getElementById('qCount');
  const qTextEl = document.getElementById('qText');
  const inputAreaEl = document.getElementById('inputArea');
  const feedbackEl = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const crossEl = document.getElementById('cross');

  function renderQuestion() {
    feedbackEl.innerText = '';

    if (current >= totalQuestions) {
      document.querySelector('.container').innerHTML = `
        <div class="title">🎉 آفرین دختر باهوش! 🎉</div>
        <div class="final">
          بازی تمام شد.<br>
          امتیاز نهایی شما: <b>${score}</b> از <b>${maxScore}</b><br><br>
          <span style="color:#d81b60;">کارت عالی بود! همیشه موفق و درخشان باشی 💖</span>
        </div>
      `;
      return;
    }

    const q = questions[current];
    qCountEl.innerText = `سوال ${current + 1} از ${totalQuestions}`;
    qTextEl.innerText = q.q;
    inputAreaEl.innerHTML = '';

    if (q.type === 'select') {
      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option);
        inputAreaEl.appendChild(btn);
      });
    } else {
      const input = document.createElement('input');
      input.type = 'number';
      input.id = 'answerInput';
      input.placeholder = 'پاسخ را وارد کنید';

      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = 'ثبت پاسخ';
      btn.onclick = () => checkAnswer(document.getElementById('answerInput').value);

      inputAreaEl.appendChild(input);
      inputAreaEl.appendChild(btn);

      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter') {
          checkAnswer(input.value);
        }
      });
    }
  }

  function playSound(src) {
    try {
      const audio = new Audio(src);
      audio.play().catch(()=>{});
    } catch(e) {}
  }

  function showFlowers() {
    const flowers = ['🌸', '🌷', '💮', '🌺', '🌼'];
    for (let i = 0; i < 15; i++) {
      const fl = document.createElement('div');
      fl.className = 'flower';
      fl.innerText = flowers[Math.floor(Math.random() * flowers.length)];
      fl.style.left = Math.random() * 100 + 'vw';
      fl.style.animationDuration = (2 + Math.random() * 2.5) + 's';
      fl.style.fontSize = (20 + Math.random() * 18) + 'px';
      document.body.appendChild(fl);
      setTimeout(() => fl.remove(), 5000);
    }
  }

  function showCross() {
    crossEl.classList.remove('show');
    void crossEl.offsetWidth;
    crossEl.classList.add('show');
    setTimeout(() => {
      crossEl.classList.remove('show');
    }, 1100);
  }

  function checkAnswer(value) {
    const q = questions[current];
    const userAnswer = String(value).trim();

    if (userAnswer == String(q.a)) {
      score += 1;
      scoreEl.innerText = score;
      feedbackEl.innerText = 'آفرین! پاسخ درست بود 👏✨';
      playSound('clap.mp3');
      showFlowers();
    } else {
      feedbackEl.innerText = 'اشکالی ندارد، دوباره تلاش کن 💛';
      playSound('beep.mp3');
      showCross();
    }

    current++;
    setTimeout(renderQuestion, 1400);
  }

  renderQuestion();
</script>


    <script src="../../shared-layout.js"></script>
</body>
</html>
