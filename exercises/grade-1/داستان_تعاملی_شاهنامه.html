        },
        end_game: {
            text: "هزاران آفرین! تو همراه با رستم توانستی از تمام هفت‌خوان با موفقیت عبور کنی و پادشاه را نجات دهی. تو نشان دادی که مثل پهلوانان شاهنامه باهوش، شجاع و دانا هستی. داستان ما در اینجا به پایان می‌رسد!",
            type: "story",
            choices: []
        }
    };

    let currentNode = 'start';
    let score = 0;
    let currentFailedAttempts = 0; // شمارنده تعداد اشتباهات در هر مرحله

    function initGame() {
        try {
            const savedNode = localStorage.getItem('shahnameh_node');
            const savedScore = localStorage.getItem('shahnameh_score');

            if (savedNode && storyNodes[savedNode]) {
                currentNode = savedNode;
            }
            if (savedScore) {
                score = parseInt(savedScore, 10);
            }
        } catch (e) {
            console.warn("Local Storage در دسترس نیست.");
        }

        updateUI();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = score;
        
        try {
            localStorage.setItem('shahnameh_node', currentNode);
            localStorage.setItem('shahnameh_score', score);
        } catch (e) {}

        const nodeData = storyNodes[currentNode];
        document.getElementById('story-text').innerText = nodeData.text;
        
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        document.getElementById('feedback-message').innerText = '';
        document.getElementById('feedback-message').className = 'feedback';

        if (nodeData.type === 'story') {
            nodeData.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = choice.text;
                btn.onclick = () => goToNode(choice.next);
                optionsContainer.appendChild(btn);
            });
        } else if (nodeData.type === 'challenge') {
            nodeData.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option.text;
                btn.onclick = () => checkAnswer(option.isCorrect, nodeData.correctNext, nodeData.points);
                optionsContainer.appendChild(btn);
            });
        }
    }

    function goToNode(nodeId) {
        currentNode = nodeId;
        currentFailedAttempts = 0; // صفر کردن شمارنده اشتباهات هنگام رفتن به مرحله جدید
        updateUI();
    }

    function checkAnswer(isCorrect, nextNode, defaultPoints) {
        const feedback = document.getElementById('feedback-message');
        
        if (isCorrect) {
            let earnedPoints = 0;
            
            // تعیین امتیاز بر اساس تعداد اشتباهات
            if (currentFailedAttempts === 0) {
                earnedPoints = defaultPoints; // بار اول: امتیاز کامل
            } else if (currentFailedAttempts === 1) {
                earnedPoints = 5; // بار دوم: 5 امتیاز
            } else {
                earnedPoints = 0; // بار سوم به بعد: 0 امتیاز
            }

            score += earnedPoints;
            document.getElementById('score-display').innerText = score;
            try { localStorage.setItem('shahnameh_score', score); } catch(e) {}
            
            feedback.innerText = "آفرین! پاسخ درست بود (+ " + earnedPoints + " امتیاز)";
            feedback.className = "feedback correct";
            
            // غیرفعال کردن دکمه‌ها تا زمان رفتن به مرحله بعد
            const buttons = document.querySelectorAll('#options .btn');
            buttons.forEach(btn => btn.disabled = true);

            setTimeout(() => {
                goToNode(nextNode);
            }, 1500);
            
        } else {
            currentFailedAttempts++; // ثبت یک اشتباه
            feedback.innerText = "اشتباه بود! دوباره تلاش کن.";
            feedback.className = "feedback wrong";
        }
    }

    function resetGame() {
        if(confirm("آیا مطمئنی می‌خواهی بازی را از اول شروع کنی؟ تمام امتیازات پاک می‌شود.")) {
            try {
                localStorage.removeItem('shahnameh_node');
                localStorage.removeItem('shahnameh_score');
            } catch(e) {}
            currentNode = 'start';
            score = 0;
            currentFailedAttempts = 0;
            updateUI();
        }
    }

    window.onload = initGame;
</script>
