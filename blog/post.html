<head>

</head>
<body>
  <div class="header-container">
      <header class="main-header">
          <a href="../index.html" class="logo">آموزش و پرورش بندر کیاشهر</a>
          <nav class="main-nav">

      </header>

  <main class="blog-page" role="main">
    <div id="post-root"></div>
  </main>

  <script src="data.js"></script>
  <script src="blog.js"></script>
  <script>
    (function(){
      const root = document.getElementById('post-root');
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || params.get('id');
      if(!slug){ root.innerHTML = '<div class="blog-not-found">آدرس مطلب معتبر نیست.</div>'; return }
      window.Blog.renderPost(root, slug);
    })();
  </script>
</body>
